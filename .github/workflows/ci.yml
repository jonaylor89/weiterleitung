name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  SQLX_OFFLINE: true
  MAILPIT_VERSION: v1.31.2

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Mailpit
        run: |
          curl -fsSL -o mailpit.tar.gz \
            "https://github.com/axllent/mailpit/releases/download/${MAILPIT_VERSION}/mailpit-linux-amd64.tar.gz"
          tar -xzf mailpit.tar.gz mailpit
          sudo install -m 0755 mailpit /usr/local/bin/mailpit
          rm mailpit mailpit.tar.gz
          # `mailpit version` alone exits 1 when its update check is rate limited.
          mailpit version --no-release-check
      - run: cargo test

  sqlx:
    name: SQLx offline data is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,sqlite --locked
      - name: Regenerate the query metadata
        env:
          DATABASE_URL: sqlite://${{ runner.temp }}/ci.db?mode=rwc
          SQLX_OFFLINE: false
        run: |
          cargo sqlx database create
          cargo sqlx migrate run
          cargo sqlx prepare --check -- --all-targets
